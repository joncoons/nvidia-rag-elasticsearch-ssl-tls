# values-local.yaml
# Local k3s deployment — Elasticsearch SSL/TLS + full NIM stack
#
# GPU sharing strategy (all NIMs):
#   nvidia.com/gpu device plugin with time-slicing (factor 4)
#   4 physical GPUs x4 = 16 virtual slots total
#   NIM Operator DRA disabled — NIM Operator v3.0.2 checks for
#   resource.k8s.io/v1beta2 which was removed in k8s 1.35 (now v1 GA)
#
# Node assignments:
#   ubuntu-local-dev (2x RTX PRO 6000 Blackwell 96 GB, 8 virtual slots):
#     LLM NIM only (NVFP4 49B, ~25 GB VRAM) — Blackwells exclusive, no env overrides needed
#   ubuntu2 (1x RTX 5090 32 GB + 1x RTX 6000 Ada 48 GB, 8 virtual slots):
#     Embedding + Reranking + OCR + graphic + page + table + nemotron-parse
#     All 7 NIMs share the 8 virtual GPU slots (both physical GPUs via time-slicing)
#     NOTE: nvidia-device-plugin v0.18.1 does NOT support per-GPU-model resource naming
#     (devices:/resources: fields are silently ignored). Per-device isolation is a
#     planned future feature. nemotron-parse is pinned to ubuntu2 and in practice
#     lands on the Ada (sm_89) slot; trtllm_buildable crashes on RTX 5090 (sm_120).
#
# VRAM budget ubuntu-local-dev (96 GB Blackwell per GPU):
#   nim-llm ~25 GB << 96 GB — no NIM_RELAX_MEM_CONSTRAINTS needed
# VRAM budget ubuntu2 (combined):
#   Embedding ~4 + Reranking ~3 + OCR ~3 + graphic ~2 + page ~4 + table ~2 = ~18 GB
#   nemotron-parse ~12 GB (must land on RTX 6000 Ada 48 GB; crashes on RTX 5090 Blackwell)
#
# NIM model cache:
#   LLM NIM: pre-cached at /mnt/nvme4/nim_cache/nim — static PV nim-llm-cache-pv
#   Other NIMs: NFS-backed PVCs via nfs-nim StorageClass (server: 192.168.1.187:/mnt/nvme4/nim_cache/nim_nfs)
#   NFS = no nodeAffinity → NIMCache download jobs and NIMService pods can run on any node

# ---------------------------------------------------------------------------
# NGC secrets — reuse the ones already in the cluster
# ---------------------------------------------------------------------------
imagePullSecret:
  create: false
  name: "ngc-secret"

ngcApiSecret:
  create: false
  name: "ngc-api"

# ---------------------------------------------------------------------------
# RAG Server — patched local image adds tavily-python + Tavily fallback wiring.
# Rebuild: cd /home/joncoons/claude/rag && docker build -f Dockerfile.rag-server-patch -t rag-server-local:latest .
# Import:  docker save rag-server-local:latest | sudo k3s ctr images import -
# ---------------------------------------------------------------------------
image:
  repository: rag-server-local
  tag: "latest"
  pullPolicy: Never

# ---------------------------------------------------------------------------
# RAG Server — Elasticsearch over HTTPS with ECK-managed elastic user auth
# ECK 3.x always enables TLS + creates 'elastic' user automatically.
# Password is in secret: rag-eck-elasticsearch-es-elastic-user (key: elastic)
#
# SSL note: elastic_transport ignores APP_VECTORSTORE_VERIFY_CERTS; TLS trust
# is established by mounting the ECK CA cert and setting SSL_CERT_FILE.
# The ConfigMap eck-es-ca-cert must exist (created once: see cluster-setup notes).
# ---------------------------------------------------------------------------
envVars:
  # Elasticsearch (ECK)
  APP_VECTORSTORE_URL: "https://rag-eck-elasticsearch-es-http:9200"
  APP_VECTORSTORE_NAME: "elasticsearch"
  APP_VECTORSTORE_SSL_ENABLED: "true"
  APP_VECTORSTORE_VERIFY_CERTS: "false"
  APP_VECTORSTORE_USERNAME: "elastic"
  APP_VECTORSTORE_PASSWORD: ""  # kubectl get secret rag-eck-elasticsearch-es-elastic-user -n rag -o jsonpath='{.data.elastic}' | base64 -d
  APP_VECTORSTORE_APIKEY: ""
  APP_VECTORSTORE_APIKEY_ID: ""
  APP_VECTORSTORE_APIKEY_SECRET: ""
  APP_VECTORSTORE_ENABLEGPUSEARCH: "False"
  # TLS trust for ECK self-signed cert (elastic_transport uses SSL_CERT_FILE)
  SSL_CERT_FILE: "/etc/ssl/eck/ca.crt"
  REQUESTS_CA_BUNDLE: "/etc/ssl/eck/ca.crt"
  # Local NIM service endpoints (overrides default NVIDIA API catalog URLs)
  APP_LLM_SERVERURL: "nim-llm:8000"
  APP_EMBEDDINGS_SERVERURL: "nemoretriever-embedding-ms:8000/v1"
  APP_RANKING_SERVERURL: "nemoretriever-ranking-ms:8000"
  APP_QUERYREWRITER_SERVERURL: "nim-llm:8000"
  APP_FILTEREXPRESSIONGENERATOR_SERVERURL: "nim-llm:8000"
  REFLECTION_LLM_SERVERURL: "nim-llm:8000"
  # VLM inference (images in queries routed to nemotron-nano-12b-v2-vl)
  ENABLE_VLM_INFERENCE: "true"
  APP_VLM_SERVERURL: "http://nim-vlm:8000/v1"
  APP_VLM_MODELNAME: "nvidia/nemotron-nano-12b-v2-vl"
  # Conversation memory — number of prior turns passed to the LLM as context.
  # Default 0 means all history is stripped before the LLM call; set > 0 to
  # enable multi-turn conversation.  Also required for query rewriting to work.
  CONVERSATION_HISTORY: "10"
  # ---------------------------------------------------------------------------
  # Tavily web-search fallback — triggered when RAG context is empty or
  # reflection marks the retrieved context as not relevant.
  # TAVILY_API_KEY is injected from the k8s secret 'tavily-api-key' (see
  # deployment.yaml extraSecretEnv block below).
  # ---------------------------------------------------------------------------
  APP_TAVILY_ENABLED: "true"

# ECK CA cert volume — mounts into the nvidia-blueprint-rag container
# ConfigMap eck-es-ca-cert must be pre-created (not managed by this chart):
#   kubectl create configmap eck-es-ca-cert -n rag \
#     --from-literal=ca.crt="$(kubectl get secret rag-eck-elasticsearch-es-http-certs-public \
#     -n rag -o jsonpath='{.data.ca\.crt}' | base64 -d)"
extraVolumes:
  - name: eck-ca
    configMap:
      name: eck-es-ca-cert

extraVolumeMounts:
  - name: eck-ca
    mountPath: /etc/ssl/eck
    readOnly: true

# ---------------------------------------------------------------------------
# Frontend — patched local image with web crawl UI, white text CSS fixes,
# CollectionDrawer layout, and KUI TextInput styling.
# Rebuild: cd /home/joncoons/claude/rag/frontend && npm run build
#          docker build -f Dockerfile.frontend-patch -t rag-frontend-local:latest .
# Import:  docker save rag-frontend-local:latest | sudo k3s ctr images import -
# ---------------------------------------------------------------------------
frontend:
  image:
    repository: rag-frontend-local
    tag: "latest"
    pullPolicy: Never

# ---------------------------------------------------------------------------
# Ingestor Server — same Elasticsearch config + ECK CA cert
# ---------------------------------------------------------------------------
ingestor-server:
  # Local patched image — adds poppler-utils + pdf2image for nemoretriever-parse
  # Pass 1 image-based classification, plus document_classifier_router.py and
  # the APP_NEMOPARSE_ENABLED server-side default wiring in main.py.
  # Rebuild: cd /home/joncoons/claude/rag && docker build -f Dockerfile.ingestor-patch -t rag-ingestor-local:latest .
  # Import:  docker save rag-ingestor-local:latest | sudo k3s ctr images import -
  image:
    repository: rag-ingestor-local
    tag: "latest"
    pullPolicy: Never
  imagePullSecret:
    create: false
    name: "ngc-secret"
  envVars:
    APP_VECTORSTORE_URL: "https://rag-eck-elasticsearch-es-http:9200"
    APP_VECTORSTORE_NAME: "elasticsearch"
    APP_VECTORSTORE_SSL_ENABLED: "true"
    APP_VECTORSTORE_VERIFY_CERTS: "false"
    APP_VECTORSTORE_USERNAME: "elastic"
    APP_VECTORSTORE_PASSWORD: ""  # kubectl get secret rag-eck-elasticsearch-es-elastic-user -n rag -o jsonpath='{.data.elastic}' | base64 -d
    APP_VECTORSTORE_APIKEY: ""
    APP_VECTORSTORE_APIKEY_ID: ""
    APP_VECTORSTORE_APIKEY_SECRET: ""
    APP_VECTORSTORE_ENABLEGPUINDEX: "False"
    APP_VECTORSTORE_ENABLEGPUSEARCH: "False"
    APP_EMBEDDINGS_SERVERURL: "nemoretriever-embedding-ms:8000/v1"
    SSL_CERT_FILE: "/etc/ssl/eck/ca.crt"
    REQUESTS_CA_BUNDLE: "/etc/ssl/eck/ca.crt"
    # ---------------------------------------------------------------------------
    # nemotron-parse — complex data element routing (tables, charts, etc.)
    # Toggle APP_NEMOPARSE_ENABLED to activate server-side default; individual
    # uploads can also set use_nemoretriever_parse=true via the API/GUI toggle.
    # APP_NEMOPARSE_SERVERURL points to the nemotron-parse NIM service.
    # ---------------------------------------------------------------------------
    APP_NEMOPARSE_ENABLED: "true"
    # nemotron-parse-v12: standalone vLLM deployment (no NIM for v1.2)
    # Service: nemotron-parse-v12 (see nemotron-parse-v12.yaml)
    APP_NEMOPARSE_SERVERURL: "http://nemotron-parse-v12:8000/v1/chat/completions"
    # Full container path — vLLM serves local models under the path they were loaded from.
    # Add --served-model-name to vllm serve (nemotron-parse-v12.yaml) to use the canonical short name.
    APP_NEMOPARSE_MODELNAME: "nvidia/NVIDIA-Nemotron-Parse-v1.2"
    APP_NEMOPARSE_APIKEY: ""   # inject via --set if NGC API key required
    # ---------------------------------------------------------------------------
    # Image extraction — enable VLM captioning for standalone images and images
    # embedded in PDFs; use multimodal VLM embeddings (nemoretriever-vlm-embedding-ms)
    # instead of text-only embedding of the caption string.
    # ---------------------------------------------------------------------------
    APP_NVINGEST_EXTRACTIMAGES: "True"      # extract + caption images embedded in PDFs
    IMAGE_ELEMENTS_MODALITY: "multimodal"   # embed image pixels via vlm-embedding-ms
  extraVolumes:
    - name: eck-ca
      configMap:
        name: eck-es-ca-cert
  extraVolumeMounts:
    - name: eck-ca
      mountPath: /etc/ssl/eck
      readOnly: true

# ---------------------------------------------------------------------------
# ECK Elasticsearch — HTTPS with ECK self-signed cert + elastic user auth
# ECK 3.x manages xpack.security internally (cannot be overridden).
# It always enables TLS and creates the 'elastic' user automatically.
# Password is stored in secret: rag-eck-elasticsearch-es-elastic-user (key: elastic)
# RAG/ingestor servers authenticate as 'elastic' using APP_VECTORSTORE_USERNAME/PASSWORD above.
#
# IMPORTANT: Do NOT set xpack.security.enabled or xpack.security.authc.anonymous.*
# in nodeSet config — these are "reserved for internal use" in ECK 3.x. Setting them
# causes ECK to emit a warning and ES to boot with security disabled.
# ---------------------------------------------------------------------------
eck-elasticsearch:
  enabled: true
  http:
    tls:
      selfSignedCertificate:
        disabled: false        # ECK generates and rotates the CA + cert automatically
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false    # only safe non-reserved setting here
    podTemplate:
      spec:
        containers:
        - name: elasticsearch

# ---------------------------------------------------------------------------
# NIMs — nvidia.com/gpu device plugin (time-sliced factor 4)
# nodeSelector pins each NIM to the correct node; GPU allocated by device plugin
# ---------------------------------------------------------------------------
nimOperator:
  # DRA disabled — NIM Operator 3.0.2 requires resource.k8s.io/v1beta2
  # which was removed in k8s 1.35 (promoted to v1 GA)
  draResources:
    enabled: false

  # LLM NIM — Nemotron Super 49B, NVFP4 on Blackwell
  # Pre-cached model at /mnt/nvme4/nim_cache/nim — static PV nim-llm-cache-pv
  # NIM_MODEL_PROFILE: force correct NVFP4 TP1 profile — NIM scans entire cache
  #   dir and incorrectly picks up nemotron-parse TRT-LLM C++ engines first
  #   (local_cache/ profiles pass GPU compat check but lack model_type → crash).
  nim-llm:
    nodeSelector:
      kubernetes.io/hostname: ubuntu-local-dev
    image:
      tag: "1.15.5"
    model:
      engine: vllm
      precision: "nvfp4"
      qosProfile: "throughput"
      tensorParallelism: "1"
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        create: false          # PVC pre-provisioned pointing to /mnt/nvme4/nim_cache/nim
        # NOTE: create:false cannot be set via helm values due to "| default true" in
        # llm-nim.yaml template (line 19). Re-apply NIMCache patch after any helm upgrade.
        name: nim-llm-cache-pvc
    env:
      # defaults from values.yaml (required — Helm replaces lists, not merges)
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_TRITON_LOG_VERBOSE
        value: "1"
      - name: NIM_SERVED_MODEL_NAME
        value: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
      # Force correct NVFP4 TP1 profile (prevents wrong local_cache profile selection)
      - name: NIM_MODEL_PROFILE
        value: "e9cc0c5ea49283a493a0b18a05a97eb9b15a82a0d6acbb967e35609ddeb767fa"

  # Embedding NIM — 1B model on ubuntu2; NFS cache (no nodeAffinity)
  nvidia-nim-llama-32-nv-embedqa-1b-v2:
    nodeSelector:
      kubernetes.io/hostname: ubuntu2
    env:
      - name: NIM_NUM_MODEL_INSTANCES
        value: "1"          # Single Triton instance; prevents auto-scaling to many instances (~27 GB default)
      - name: NIM_TRITON_PERFORMANCE_MODE
        value: "latency"    # Single-instance latency mode; default but explicit
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        create: true
        storageClass: nfs-nim
        size: "50Gi"
        volumeAccessMode: ReadWriteMany

  # Reranking NIM — 1B model on ubuntu2; NFS cache (no nodeAffinity)
  nvidia-nim-llama-32-nv-rerankqa-1b-v2:
    nodeSelector:
      kubernetes.io/hostname: ubuntu2
    env:
      - name: NIM_NUM_MODEL_INSTANCES
        value: "1"          # Single Triton instance; limits memory to ~2-3 GB vs unconstrained default
      - name: NIM_TRITON_PERFORMANCE_MODE
        value: "latency"    # Single-instance latency mode; default but explicit
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        create: true
        storageClass: nfs-nim
        size: "50Gi"
        volumeAccessMode: ReadWriteMany

  # VLM Embedding NIM — 1B VLM embedding model on ubuntu2 (RTX 5090 / RTX 6000 Ada, best-effort)
  nvidia-nim-llama-32-nemoretriever-1b-vlm-embed-v1:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: ubuntu2
    env:
      - name: NIM_NUM_MODEL_INSTANCES
        value: "1"
      - name: NIM_TRITON_PERFORMANCE_MODE
        value: "latency"
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        create: true
        storageClass: nfs-nim
        size: "50Gi"
        volumeAccessMode: ReadWriteMany

  # nemotron-parse — DISABLED: NIM v1.1 crashes on Blackwell sm_120 and RTX 5090.
  # Replaced by standalone vLLM deployment: nemotron-parse-v12.yaml
  # (nvidia/NVIDIA-Nemotron-Parse-v1.2 — no NIM available for v1.2)
  # Service endpoint updated in ingestor-server.envVars below.
  nemotron-parse:
    enabled: false
    nodeSelector:
      kubernetes.io/hostname: ubuntu2
    cacheNodeSelector:
      kubernetes.io/hostname: ubuntu2
    storage:
      pvc:
        create: true
        size: "50Gi"
        volumeAccessMode: ReadWriteOnce
    env:
      - name: LOCAL_NIM_CACHE
        value: /opt/nim/.cache
      - name: NIM_NUM_MODEL_INSTANCES
        value: "1"
      - name: NIM_TRITON_PERFORMANCE_MODE
        value: "latency"
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"

  # VLM NIM — Nemotron Nano 12B Vision-Language Model on ubuntu-local-dev GPU1 (RTX PRO 6000 Blackwell, 96 GB)
  # Model uses BF16 execution (NIM profile: BF16 TP1 + ModelOpt fp8 checkpoint storage)
  # vLLM profiling footprint: ~31.85 GB (weights ~24 GB + CUDA + 4 GB mm_processor_cache)
  # NIM_KVCACHE_PERCENT=0.40: 0.40×97=38.8 GB budget − 31.85 GB model = 7 GB KV cache
  # Minimum viable: 0.34 (~1 GB KV cache). 20% impossible (model alone > 20% of 96 GB).
  # VRAM barrier: GPU0 has only 6 GB free (nim-llm ~91 GB) → vLLM startup check fails on GPU0
  # (38.8 GB needed > 6 GB free), passes on GPU1. Pod must be deleted+rescheduled off GPU0.
  nim-vlm:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: ubuntu-local-dev
    env:
      - name: NIM_KVCACHE_PERCENT
        value: "0.40"
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        create: true
        storageClass: nfs-nim
        size: "50Gi"
        volumeAccessMode: ReadWriteMany

# ---------------------------------------------------------------------------
# nv-ingest — all document NIMs enabled
# These use legacy nvidia.com/gpu (time-sliced via device plugin, factor 4)
# Milvus disabled — Elasticsearch is the vector store
# ---------------------------------------------------------------------------
nv-ingest:
  milvusDeployed: false
  envVars:
    APP_NVINGEST_SEGMENTAUDIO: "True"   # Enable audio transcription via parakeet NIM
    # VLM_CAPTION_PROMPT cannot be overridden here — Helm strategic-merge patch ordering
    # conflict when the var already exists in the nv-ingest Deployment spec.
    # Applied directly via kubectl (see below). Value committed for reference:
    # "Provide a detailed description of this image. Identify and transcribe all visible
    #  text (OCR). Describe all objects, people, diagrams, charts, tables, graphs, and
    #  spatial relationships. Be thorough and precise so the description can stand alone
    #  as searchable text."
  nimOperator:
    # OCR on ubuntu2; NFS cache (no nodeAffinity)
    nemoretriever_ocr_v1:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: ubuntu2
      storage:
        pvc:
          create: true
          storageClass: nfs-nim
          size: "25Gi"
          volumeAccessMode: ReadWriteMany
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      env:
        - name: NIM_NUM_MODEL_INSTANCES
          value: "1"    # Single Triton instance; OCR default is unconstrained and expensive
    # graphic_elements on ubuntu2; NFS cache
    graphic_elements:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: ubuntu2
      storage:
        pvc:
          create: true
          storageClass: nfs-nim
          size: "25Gi"
          volumeAccessMode: ReadWriteMany
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      env:
        - name: NIM_NUM_MODEL_INSTANCES
          value: "1"    # Single Triton instance to minimize GPU memory footprint
    # page_elements on ubuntu2; NFS cache
    page_elements:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: ubuntu2
      storage:
        pvc:
          create: true
          storageClass: nfs-nim
          size: "25Gi"
          volumeAccessMode: ReadWriteMany
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      env:
        - name: NIM_NUM_MODEL_INSTANCES
          value: "1"    # Single Triton instance; page-elements default consumes ~15 GB unconstrained
    # table_structure on ubuntu2; NFS cache
    table_structure:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: ubuntu2
      storage:
        pvc:
          create: true
          storageClass: nfs-nim
          size: "25Gi"
          volumeAccessMode: ReadWriteMany
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      env:
        - name: NIM_NUM_MODEL_INSTANCES
          value: "1"    # Single Triton instance to minimize GPU memory footprint
    # Audio NIM — Parakeet 1.1B CTC ASR on ubuntu2 RTX 6000 Ada (sm_89, 49 GB)
    # Moved from ubuntu-local-dev: TRT compilation failed on Blackwell sm_120 (cuDNN missing,
    # GPU OOM ~1.5 GB short). RTX 6000 Ada has proper cuDNN support and sufficient free VRAM.
    audio:
      enabled: true
      authSecret: ngc-api
      nodeSelector:
        kubernetes.io/hostname: ubuntu2
      storage:
        pvc:
          create: true
          storageClass: nfs-nim
          size: "25Gi"
          volumeAccessMode: ReadWriteMany
      image:
        repository: nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us
        tag: "latest"
      env:
        - name: NIM_TAGS_SELECTOR
          value: "name=parakeet-1-1b-ctc-en-us,mode=ofl"
        - name: NIM_TRITON_LOG_VERBOSE
          value: "1"
        - name: NIM_NUM_MODEL_INSTANCES
          value: "1"
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"


# ---------------------------------------------------------------------------
# Observability — disabled for local testing
# ---------------------------------------------------------------------------
opentelemetry-collector:
  enabled: false

zipkin:
  enabled: false

kube-prometheus-stack:
  enabled: false
