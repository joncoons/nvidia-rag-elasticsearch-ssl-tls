# nemotron-parse-v12.yaml
# Standalone vLLM deployment for nvidia/NVIDIA-Nemotron-Parse-v1.2
# No NIM available for v1.2 — served directly via vLLM v0.14.1+
#
# Prerequisites (run once as root):
#   sudo tee -a /etc/exports <<'EOF'
#   /mnt/nvme2/hf_models *(rw,sync,no_subtree_check,no_root_squash)
#   EOF
#   sudo exportfs -ra
#
# Storage layout:
#   NFS server:  192.168.1.187:/mnt/nvme2/hf_models
#   Model path:  /mnt/nvme2/hf_models/nvidia/NVIDIA-Nemotron-Parse-v1.2 (on server)
#   In container: /hf-models/nvidia/NVIDIA-Nemotron-Parse-v1.2
#
# To redeploy on ubuntu2 (RTX 6000 Ada, sm_89):
#   1. Change Deployment nodeSelector → kubernetes.io/hostname: ubuntu2
#   2. No other changes needed (NFS PV is node-independent)
#   3. vllm/vllm-openai:v0.14.1 supports sm_89 natively — drop --attention-backend flag if desired
#
# Apply:
#   kubectl apply -f nemotron-parse-v12.yaml
# Delete NIMService (NIM Operator will stop reconciling nemotron-parse):
#   helm upgrade --install rag nvidia-blueprint-rag -n rag -f values-local.yaml \
#     --set nimOperator.nemotron-parse.enabled=false \
#     --set envVars.APP_VECTORSTORE_PASSWORD=<pw> \
#     --set ingestor-server.envVars.APP_VECTORSTORE_PASSWORD=<pw>

---
# Static NFS PersistentVolume — 192.168.1.187:/mnt/nvme2/hf_models
# ReadWriteMany so both ubuntu-local-dev and ubuntu2 can mount simultaneously if needed
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-models-nfs-pv
  labels:
    app: hf-models-nfs
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.187
    path: /mnt/nvme2/hf_models
  mountOptions:
    - hard
    - nfsvers=4.1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-models-nfs-pvc
  namespace: rag
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  selector:
    matchLabels:
      app: hf-models-nfs
  volumeName: hf-models-nfs-pv
  storageClassName: ""   # static binding — no provisioner

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-parse-v12
  namespace: rag
  labels:
    app: nemotron-parse-v12
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nemotron-parse-v12
  template:
    metadata:
      labels:
        app: nemotron-parse-v12
    spec:
      # Pin to second Blackwell GPU on ubuntu-local-dev.
      # To redeploy on ubuntu2: change to "ubuntu2"
      nodeSelector:
        kubernetes.io/hostname: ubuntu-local-dev
      # Required for shared memory (vLLM tensor parallel / CUDA IPC)
      volumes:
        - name: hf-models
          persistentVolumeClaim:
            claimName: hf-models-nfs-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: logitsprocs
          emptyDir: {}
      initContainers:
        # Copy logits processors from model dir into a writable location on the Python path.
        # vLLM's --logits-processors flag resolves module names from sys.path;
        # /logitsprocs is added via PYTHONPATH below.
        - name: copy-logitsprocs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /hf-models/nvidia/NVIDIA-Nemotron-Parse-v1.2/logitsprocs/nemotron_parse_vllm_logitprocs.py \
                 /logitsprocs/
          volumeMounts:
            - name: hf-models
              mountPath: /hf-models
              readOnly: true
            - name: logitsprocs
              mountPath: /logitsprocs
      containers:
        - name: nemotron-parse-v12
          image: vllm/vllm-openai:v0.14.1
          # Install missing model dependencies then launch vllm serve.
          # open_clip_torch, albumentations, timm are required by the model's
          # trust_remote_code custom files but not bundled in the vllm image.
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install open_clip_torch albumentations timm -q &&
              vllm serve /hf-models/nvidia/NVIDIA-Nemotron-Parse-v1.2 \
                --served-model-name nvidia/NVIDIA-Nemotron-Parse-v1.2 \
                --dtype=bfloat16 \
                --max-num-seqs=4 \
                '--limit-mm-per-prompt={"image": 1}' \
                --attention-backend=TRITON_ATTN \
                --trust-remote-code \
                --max-model-len=9000 \
                --gpu-memory-utilization=0.20 \
                --port=8000 \
                --logits-processors=nemotron_parse_vllm_logitprocs:NemotronParseRepetitionStopLogitsProcessor
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HF_TOKEN
            # Point HF cache at the NFS volume so model is not re-downloaded on restart
            - name: HF_HOME
              value: /hf-models/.hf-cache
            # Add /logitsprocs to Python path so --logits-processors module resolves
            - name: PYTHONPATH
              value: /logitsprocs
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-models
              mountPath: /hf-models
              readOnly: false   # writeable for .hf-cache
            - name: dshm
              mountPath: /dev/shm
            - name: logitsprocs
              mountPath: /logitsprocs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-parse-v12
  namespace: rag
  labels:
    app: nemotron-parse-v12
spec:
  selector:
    app: nemotron-parse-v12
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
